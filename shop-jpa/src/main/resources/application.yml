spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[generate_statistics]': true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console
logging:
  level:
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.orm.jdbc.bind]': TRACE
    '[org.hibernate.engine.jdbc.batch]': TRACE
