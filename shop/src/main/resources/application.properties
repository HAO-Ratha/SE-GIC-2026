spring.application.name=shop
# No profile given -> run on H2 so the app starts without Docker
spring.profiles.default=test

shop.tax-rate=0.20

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# [requestId] comes from the MDC value set by AuditAspect
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %m%n